<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Aegis Med - Acceso</title>
    
</head>
<body>
    <div class="login-card">
        <h2 id="form-title">Ingresar a SIMEB</h2>
        <form id="auth-form" onsubmit="procesarAutenticacion(event)">
            <div class="form-group" id="group-nombre" style="display: none;">
                <label>Nombre Completo</label>
                <input type="text" id="auth-nombre" placeholder="Ej. Luis Torres">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="auth-usuario" placeholder="usuario@simeb.com" required>
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="auth-clave" placeholder="••••••••" required>
            </div>
            <div class="form-group">
                <label>Selecciona tu Rol Asignado</label>
                <select id="auth-rol" required>
                    <option value="" disabled selected>Escoge tu rol</option>
                    <option value="Enfermero">Enfermero (Central de Monitoreo)</option>
                    <option value="Técnico">Técnico (Soporte y Tickets)</option>
                    <option value="Admin">Administrador (Dashboard Global)</option>
                </select>
            </div>
            <button type="submit" id="btn-submit">Iniciar Sesión</button>
            <div class="toggle-form" id="toggle-text" onclick="alternarModoFormulario()">¿No tienes cuenta? Registrate aquí</div>
        </form>
    </div>
    <script>
        let esModoRegistro = false;
        function alternarModoFormulario() {
            esModoRegistro = !esModoRegistro;
            document.getElementById("form-title").innerText = esModoRegistro ? "Registro de Cuenta" : "Ingresar a SIMEB";
            document.getElementById("btn-submit").innerText = esModoRegistro ? "Crear Cuenta" : "Iniciar Sesión";
            document.getElementById("toggle-text").innerText = esModoRegistro ? "¿Ya tienes cuenta? Ingresa aquí" : "¿No tienes cuenta? Registrate aquí";
            document.getElementById("group-nombre").style.display = esModoRegistro ? "flex" : "none";
            document.getElementById("auth-nombre").required = esModoRegistro;
        }
        async function procesarAutenticacion(e) {
            e.preventDefault();
            const usuario = document.getElementById("auth-usuario").value;
            const clave = document.getElementById("auth-clave").value;
            const rol = document.getElementById("auth-rol").value;
            const nombre = document.getElementById("auth-nombre").value;
            const endpoint = esModoRegistro ? 'registrar' : 'login';
            let cuerpoReq = esModoRegistro ? { nombre, usuario, clave, rol } : { usuario, clave, rol };
            try {
                const respuesta = await fetch(`/api/auth/${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cuerpoReq)
                });
                const data = await respuesta.json();
                if (respuesta.ok) {
                    if (esModoRegistro) {
                        alert("Registro enviado. Espera la aprobación del Administrador.");
                        alternarModoFormulario();
                    } else {
                        localStorage.setItem("userRol", data.rol);
                        localStorage.setItem("userNombre", data.nombre || "Personal de turno");
                        if (data.rol === "Admin") window.location.href = "paneladmin/admin.html";
                        else if (data.rol === "Enfermero") window.location.href = "RolEnfermero/monitor.html";
                        else if (data.rol === "Técnico") window.location.href = "gestor_tickes/index.html";
                    }
                } else { alert(data.mensaje); }
            } catch (err) { alert("No se pudo conectar con el servidor central."); }
        }
    </script>
</body>
</html>
